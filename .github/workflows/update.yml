# Refits the model every morning, predicts upcoming fixtures, scores finished ones, replays the
# rest of the Champions League season for the forecast, and commits the updated ledger, ratings,
# scorecard and forecast back to the repository.
name: Daily update

on:
  schedule:
    - cron: "30 5 * * *"  # 05:30 UTC = 11:00 in India
  workflow_dispatch:       # also allows a manual run from the Actions tab

permissions:
  contents: write

# A manual run and the scheduled one must not overlap: the second push would be rejected.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore downloaded results
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Install
        run: pip install -r requirements.txt

      - name: Download new results
        run: python scripts/download_data.py --refresh-current

      - name: Refit, predict and score
        run: python src/update.py

      # Only while the season's league phase is on. It must never stop the day's predictions from
      # being saved: if Wikipedia can't be read, the last forecast stays (with its date) and the
      # dashboard drops it after two weeks.
      - name: Forecast the season
        continue-on-error: true
        run: python src/forecast.py

      - name: Refresh dashboard data
        run: python src/export_site.py

      # Never commit a data.json that disagrees with itself. (README wording is checked by the
      # Tests workflow instead: a stale README shouldn't stop the day's predictions being saved.)
      - name: Check the results
        run: |
          pip install pytest==8.4.2
          pytest tests/test_pipeline.py tests/test_data.py -m "not readme" -o addopts=""

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # results/ as a whole, so that a forecast taken down when its stage ends is committed as a deletion too
          git add -A results site/data.json site/preview.png
          git diff --cached --quiet || git commit -m "Daily update: predictions and scorecard"
          git pull --rebase   # in case something was pushed while this job ran
          git push
