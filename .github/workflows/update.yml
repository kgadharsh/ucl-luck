# Refits the model every morning, predicts upcoming fixtures, scores finished ones,
# and commits the updated ledger, ratings and scorecard back to the repository.
name: Daily update

on:
  schedule:
    - cron: "30 5 * * *"  # 05:30 UTC = 11:00 in India
  workflow_dispatch:       # also allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore downloaded results
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Install
        run: pip install -r requirements.txt

      - name: Download new results
        run: python scripts/download_data.py --refresh-current

      - name: Refit, predict and score
        run: python src/update.py

      - name: Refresh dashboard data
        run: python src/export_site.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/live site/data.json
          git diff --cached --quiet || git commit -m "Daily update: predictions and scorecard"
          git push
